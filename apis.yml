name: Huuva
description: Huuva is a Finnish food-court aggregator that lets customers order from
  multiple partner restaurants in a single order under the tagline "The hottest restaurants,
  all in one address." It operates physical food-court locations across Finland and
  runs a consumer web and mobile ordering platform for delivery and pickup, alongside
  lunch services and gift cards. Huuva is a consumer marketplace in the restaurant-technology
  and food-delivery space and does not currently publish a public developer or API
  program. It is a General Catalyst portfolio company based in Europe.
